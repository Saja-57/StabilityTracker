  <path d="M19.5 23.5C10.5 31.5 10.5 47 21.5 53.2c7.8 4.4 17.6 3.2 24.2-1.6" stroke="#1C362E" stroke-width="6.4" stroke-linecap="round"/>
  <!-- Child, held inside the embrace -->
