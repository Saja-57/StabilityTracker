  <path d="M49.6 7.4l1.7-2.7M55.6 12.8l2.8-1.5M58.2 20.2l3.1-.3" stroke="#E2B04F" stroke-width="2.9" stroke-linecap="round"/>
  <!-- Caregiver: head, then one continuous embrace -->
